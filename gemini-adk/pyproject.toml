[project]
name = "gemini-adk"
version = "0.1.0"
description = "Google ADK (Python) で文章要約機能を試すハンズオン"
readme = "README.md"
authors = [
    { name = "chrptos", email = "chrptos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
